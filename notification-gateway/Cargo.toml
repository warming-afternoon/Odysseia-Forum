[package]
name = "forum-notification-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-nats = "0.40"
axum = { version = "0.8.8", features = ["ws"] }
futures-util = "0.3"
redis = { version = "0.29", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.28"
