services:
  odysseia-forum-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: odysseia-forum-bot
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      odysseia-redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src
      REDIS_URL: redis://odysseia-redis:6379/0
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python3", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 120s

  odysseia-forum-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: odysseia-forum-api
    restart: unless-stopped
    working_dir: /app
    ports:
      - "10810:10810"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      PYTHONPATH: /app/src
      REDIS_URL: redis://odysseia-redis:6379/0
    depends_on:
      odysseia-redis:
        condition: service_healthy
      odysseia-forum-bot:
        condition: service_healthy
    command: ["uv", "run", "api_main.py"]
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:10810/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  odysseia-forum-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: odysseia-forum-migrate
    profiles:
      - migrate
    working_dir: /app
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
    environment:
      PYTHONPATH: /app/src
    command: ["uv", "run", "migrate.py"]

  odysseia-redis:
    image: redis:alpine
    container_name: odysseia-redis
    restart: unless-stopped
    ports:
      - "11810:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: ["redis-server", "--appendonly", "yes"]
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
