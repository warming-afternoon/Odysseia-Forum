services:
  odysseia-forum:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: odysseia-forum
    restart: unless-stopped
    working_dir: /app
    ports:
      - "10810:10810"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
    depends_on:
      odysseia-redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src
      REDIS_URL: redis://odysseia-redis:6379/0

  odysseia-forum-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: odysseia-forum-migrate
    profiles:
      - migrate
    working_dir: /app
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
    environment:
      PYTHONPATH: /app/src
    command: ["uv", "run", "migrate.py"]

  odysseia-redis:
    image: redis:alpine
    container_name: odysseia-redis
    restart: unless-stopped
    ports:
      - "11810:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: ["redis-server", "--appendonly", "yes"]
